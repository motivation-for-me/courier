<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Delivery Rider — High Speed Loop</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #fff; }
    body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #191919; }
    #stage { position: fixed; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; }
    .hud { position: fixed; inset: 24px 28px auto; display: flex; align-items: center; justify-content: space-between; pointer-events: none; }
    .label { display: flex; align-items: center; gap: 10px; font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #d52e23; box-shadow: 0 0 0 5px rgba(213,46,35,.10); }
    .controls { pointer-events: auto; display: flex; gap: 8px; }
    button { border: 1px solid #dedede; background: rgba(255,255,255,.86); backdrop-filter: blur(10px); color: #202020; border-radius: 999px; padding: 9px 14px; font: inherit; font-size: 12px; cursor: pointer; }
    button:hover { border-color: #999; }
    .meter { position: fixed; left: 28px; bottom: 25px; width: 120px; height: 2px; background: #eee; overflow: hidden; }
    .meter::after { content: ''; display: block; width: 65%; height: 100%; background: #d52e23; animation: pulse 1.4s ease-in-out infinite alternate; transform-origin: left; }
    @keyframes pulse { to { transform: scaleX(1.45); } }
    @media (max-width: 720px) { .hud { inset: 16px 16px auto; } .label span:last-child, .meter { display:none; } }
    html.embed .hud, html.embed .meter { display: none; }
    @media (prefers-reduced-motion: reduce) { .meter::after { animation: none; } }
  </style>
  <script>if (new URLSearchParams(location.search).has('embed')) document.documentElement.classList.add('embed');</script>
  <script type="importmap">
    { "imports": { "three": "/node_modules/three/build/three.module.js" } }
  </script>
</head>
<body>
  <main id="stage" aria-label="Looping 3D animation of a delivery rider moving at speed"></main>
  <div class="hud">
    <div class="label"><i class="dot"></i><span>High-speed delivery run</span></div>
    <div class="controls">
      <button id="motion" type="button" aria-pressed="true">Motion FX: on</button>
      <button id="pause" type="button" aria-pressed="false">Pause</button>
    </div>
  </div>
  <div class="meter" aria-hidden="true"></div>
  <script type="module" src="./scene.js"></script>
</body>
</html>
