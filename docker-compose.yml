services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - courier-redis:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: change-me
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - courier-minio:/data

volumes:
  courier-redis:
  courier-minio:
